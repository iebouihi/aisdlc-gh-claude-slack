name: Refinement sync

# Follows every in-refinement Slack thread: follow-up questions, final proposal,
# ✅ approval -> write-back to the issue, nudges and blocked status.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refine-sync
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install anthropic requests
      - name: Sync refinement threads
        run: python .github/scripts/refine.py sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0CDNGE90V7' }}
          SLACK_APPROVER_ID: ${{ vars.SLACK_APPROVER_ID || 'U0CEESZR9A4' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
