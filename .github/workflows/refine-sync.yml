name: Refinement sync

# Follows every in-refinement Slack thread: follow-ups, final proposal,
# approval -> write-back to the issue, nudges and blocked status.
# Settings and texts: config/refinement.yml. Instructions: .claude/agents + .claude/skills.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refine-sync
  cancel-in-progress: false

permissions:
  issues: write
  contents: write        # push the living spec branch
  pull-requests: write   # open the living spec PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Sync refinement threads
        run: python -m automation.refinement sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # optional overrides of config/refinement.yml (repo variables)
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_APPROVER_ID: ${{ vars.SLACK_APPROVER_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
