name: Claude (@claude)

# Reviewers write "@claude <request>" on a pull request (or issue) -> the agent that owns the branch
# applies it, with the same agent, skills and permission rules as its own run: the designer on
# design/ branches (design/ only), the developer everywhere else (app/ only).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Branch of the pull request (picks the agent)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ISSUE_PR: ${{ github.event.issue.pull_request.url }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          ref="$HEAD_REF"
          if [ -z "$ref" ] && [ -n "$ISSUE_PR" ]; then
            ref=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Agent settings from config (designer on design branches, developer otherwise)
        id: args
        run: python -m automation.refinement agent-args "$REF"
        env:
          REF: ${{ steps.pr.outputs.ref }}
          DEV_CLAUDE_MODEL: ${{ vars.DEV_CLAUDE_MODEL }}
          DESIGN_CLAUDE_MODEL: ${{ vars.DESIGN_CLAUDE_MODEL }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Agent applies the request
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: ${{ steps.args.outputs.claude_args }}
          settings: ${{ steps.args.outputs.settings }}
      - name: Record token usage (issue comment + CSV on the metrics branch)
        if: always() && steps.agent.outputs.execution_file != '' && steps.pr.outputs.ref != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.pr.outputs.ref }}
        run: |
          case "$REF" in design/*) phase=design ;; fix/*) phase=bug ;; spec/*) phase=refinement ;; *) phase=development ;; esac
          python -m automation.refinement usage "$REF" "$phase" review-changes
