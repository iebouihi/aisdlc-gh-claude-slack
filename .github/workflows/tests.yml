name: Tests

on:
  push:
    paths: ["automation/**", ".claude/**", "config/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - run: python -m automation.tests.test_refinement
      - run: python -m automation.tests.test_bugs
