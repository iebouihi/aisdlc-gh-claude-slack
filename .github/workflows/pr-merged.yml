name: PR merged

# A merged living spec PR (config specs.branch_prefix) -> issue ready-for-dev.
# A merged developer PR (config delivery.branch_prefix) -> issue done and closed.
# Any other merged PR: the run exits at once.
on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  contents: write
  pull-requests: read

jobs:
  merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Move the issue forward
        run: python -m automation.refinement pr-merged ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
