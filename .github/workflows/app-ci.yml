name: App CI

# Typecheck, tests and static build of the app, on every PR and on main.
# Agent PRs (branch prefixes dev/ and fix/) must also stay inside app/ - a deterministic guard,
# whatever the agent's instructions say.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  agent-scope:
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'dev/') || startsWith(github.head_ref, 'fix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Agent changes stay inside app/
        run: |
          outside=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^app/' || true)
          if [ -n "$outside" ]; then
            echo "::error title=Agent changed files outside app/::$(echo $outside | tr '\n' ' ')"
            exit 1
          fi
          echo "All changes are inside app/."
