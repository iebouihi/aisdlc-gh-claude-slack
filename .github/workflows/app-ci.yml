name: App CI

# Typecheck, tests and static build of the app, on every PR and on main.
# Agent PRs must also stay inside their folder - dev/ and fix/ in app/, design/ in design/ - a deterministic guard,
# whatever the agent's instructions say.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  agent-scope:
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'dev/') || startsWith(github.head_ref, 'fix/') ||
       startsWith(github.head_ref, 'design/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Agent changes stay inside their folder (designer design/, developer app/)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in design/*) allowed=design ;; *) allowed=app ;; esac
          outside=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -v "^$allowed/" || true)
          if [ -n "$outside" ]; then
            echo "::error title=Agent changed files outside $allowed/::$(echo $outside | tr '\n' ' ')"
            exit 1
          fi
          echo "All changes are inside $allowed/."
