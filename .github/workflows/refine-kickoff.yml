name: Refinement kickoff

# An issue gets the "start refinement" label (config: github.labels.needs) ->
# the requirements-refiner agent opens a Slack thread. Any other label: the run exits at once.
# Settings and texts: config/refinement.yml. Instructions: .claude/agents + .claude/skills.
on:
  issues:
    types: [opened, labeled]

concurrency:
  group: refine-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  kickoff:
    if: github.event.action == 'labeled' || github.event.issue.labels[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Open refinement thread
        run: python -m automation.refinement kickoff ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # optional overrides of config/refinement.yml (repo variables)
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_APPROVER_ID: ${{ vars.SLACK_APPROVER_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
