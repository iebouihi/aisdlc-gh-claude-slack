# Requirement refinement - all settings and texts in one place.
# Read by the automation (automation/refinement) and by the requirements-refiner agent.
# Environment variables override the values marked (env: NAME).

product:
  name: good-habit-tracker
  description: >-
    A small static Next.js web app for tracking daily habits. No backend and no login;
    all data stays in the user's browser.

github:
  repo: iebouihi/aisdlc-gh-claude-slack          # (env: GITHUB_REPOSITORY)
  base_branch: main
  labels:
    needs: needs-refinement      # added by the PO: start refinement
    active: in-refinement        # thread open in Slack
    spec_review: spec-review     # approved; living spec pull request waiting for merge
    ready: ready-for-dev         # spec merged, issue body is final
    blocked: blocked             # no answers for too long

slack:
  channel_id: C0CDNGE90V7        # #claude-app            (env: SLACK_CHANNEL_ID)
  approver_id: U0CEESZR9A4       # Imad Eddine B          (env: SLACK_APPROVER_ID)
  max_message_chars: 3500        # longer texts are split at line breaks into several messages
  # signatures some Slack clients/apps append to a reply; removed before reading replies (regexes)
  ignore_text_patterns: ["\\n*\\*?Sent using\\*? .*$"]
  broadcast_spec_pr: true        # also show the spec PR announcement in the channel, not only the thread

claude:
  model: claude-sonnet-5-5       # (env: CLAUDE_MODEL)
  max_tokens: 16000
  cache_system_prompt: true      # prompt caching: agent + skills are identical across runs of a step
  agent: requirements-refiner    # .claude/agents/<agent>.md
  # Developers in Claude Code get every skill the agent preloads. The automation loads only
  # what each step needs: the step's skill (whose output.schema.json is the answer) + `uses`.
  steps:
    select:
      skill: impact-analysis
      uses: []
    kickoff:
      skill: refine-kickoff
      uses: [living-spec]
    thread:
      skill: refine-thread
      uses: [requirement-format, living-spec]

# Living specs: current behaviour, one file per capability (see the living-spec skill).
specs:
  dir: specs
  file_pattern: '^specs/[a-z0-9-]+/[a-z0-9-]+\.md$'
  required_fields: [id, title, module, summary, entities, status, issues, updated]
  branch_prefix: spec/issue-     # approval pushes the spec changes to spec/issue-<n>
  # context budgets: keep each Claude call small however many specs exist
  max_specs: 5                   # specs loaded into a refinement
  context_chars: 30000           # max characters of spec content per call
  index_chars: 12000             # spec index larger than this -> pick modules first, then specs
  generated:
    root_title: "# Living specs"
    root_intro: "How {product} works today, one file per capability. Generated from the specs' frontmatter; do not edit by hand."
    module_line: "- [{module}]({module}/README.md): {count} capabilities. Entities: {entities}"
    module_title: "# {module}"
    module_intro: "Capabilities in this module. Generated; do not edit by hand."
    capability_line: "- [{title}]({file}) `{id}`: {summary} (entities: {entities}; decisions: {decisions}; issues: {issues})"
    empty: "No specs yet. They are created when the first requirement is approved."
    index_module: "{module} | {count} capabilities | entities: {entities} | {titles}"
    index_spec: "{id} | {title} | entities: {entities} | {summary}"
    context_spec: "### {path}\n\n{content}"
    context_none: "(no related living specs yet)"

refinement:
  question_groups:
    - Scope
    - Behaviour & edge cases
    - Data
    - UX
    - Non-functional
    - Dependencies & risks
  other_group: Other             # for questions that name no known group
  nudge_after_days: 3            # then blocked after the same delay again
  # lines dropped from Claude's Slack proposal if it repeats what messages.slack.proposal adds
  # (regexes, matched on lower-case text without emoji or punctuation)
  proposal_strip_lines: ["proposed final requirement", "^react\\b.*\\bapprove"]
  approval:
    reactions: [white_check_mark, heavy_check_mark]
    # a reply from the approver made only of these words / emoji counts as approval
    reply_words: ["✅", "✔️", ":white_check_mark:", ":heavy_check_mark:", ":+1:", "👍",
                  "approve", "approved", "lgtm", "go", "go ahead", "ship it", "ok", "okay"]

# Delivery: the developer agent implements ready issues in app/ (Claude Code GitHub Action).
delivery:
  labels:
    trigger: implement           # a person adds it to a ready-for-dev issue to start the agent
    active: in-development       # the agent is working
    review: in-review            # pull request open, waiting for people
    done: done                   # merged; the issue is closed
  branch_prefix: dev/issue-
  agent: developer               # .claude/agents/developer.md (runs as the main session)
  prompt: "/implement-issue {number} {branch}"   # the implement-issue skill
  model: claude-sonnet-5-5       # (env: DEV_CLAUDE_MODEL)
  max_turns: 80
  settings: .claude/developer-settings.json      # permission rules: app/ only

# Bug fixes: investigate the root cause, a person validates, then the developer agent fixes.
# Same Slack channel; Slack gets status only (no questions there).
bugs:
  type: Bug                      # GitHub issue type the flow accepts (organization-owned repos)
  type_label: bug                # same meaning as a label: issue types can't be set on personal repos
  branch_prefix: fix/issue-
  report_file: .agent/root-cause.md               # the investigator writes it, the automation posts it
  max_report_chars: 60000
  labels:
    trigger: need-fix            # a person adds it to a Bug: start the investigation
    analyzing: analyzing         # investigator agent running
    proposed: fix-proposed       # root cause + fix plan posted, waiting for validation
    approved: fix-approved       # a person validates: starts the fix (developer agent)
    needs_info: needs-info       # reporter must answer; add need-fix again afterwards
    spec_gap: spec-gap           # the specs don't define it: refine it first
    not_a_bug: not-a-bug         # works as specified: a change would be a requirement
  # report verdict -> state label key above (unknown verdicts wait for validation)
  verdicts: {bug: proposed, spec-gap: spec_gap, not-a-bug: not_a_bug, needs-info: needs_info,
             cannot-reproduce: needs_info}
  investigator:
    agent: bug-investigator      # .claude/agents/bug-investigator.md
    prompt: "/investigate-bug {number} {report}"
    model: claude-sonnet-5-5     # (env: BUG_CLAUDE_MODEL)
    max_turns: 60
    settings: .claude/investigator-settings.json  # read + reproduce; no commit, no push
  fixer:                         # runs as the developer agent (delivery.agent and its settings)
    prompt: "/fix-bug {number} {branch}"

# What the automation asks Claude for each step ({...} are filled in by the automation).
tasks:
  select: |
    Use your impact-analysis skill. Choose at most {limit} {level} this issue touches.

    Product: {product}

    {issue}

    Available {level} (one per line):
    {index}
  kickoff: |
    Use your refine-kickoff skill on this issue.

    Product: {product}
    Question groups: {groups}

    {issue}

    Related living specs:

    {context}
  thread: |
    Use your refine-thread skill on this refinement.

    Product: {product}
    Thread link: {thread_link}
    Today: {date}

    {issue}

    Related living specs (current content):

    {context}

    Slack thread so far:

    {transcript}
  tool_reminder: "Answer only by calling the `{tool}` tool."
  tool_retry: "Please call the `{tool}` tool now with your answer."
  level_modules: modules
  level_specs: specs

# Every text the automation posts. Slack texts use Slack mrkdwn.
messages:
  slack:
    kickoff: |-
      🧩 *Refinement: #{number} {title}*
      <{url}|View issue #{number} on GitHub>

      {restatement}

      Questions are in the thread 👇 Answer by number (e.g. "3: yes"). Each has a proposed default, so "ok" works too.
    related_specs: "📚 Builds on living specs: {specs}"
    questions_header: "*Open questions for #{number}* (proposed default in _italics_)"
    question_group: "*{group}*"
    question: "{index}. {question}"
    question_default: " _{default}_"
    questions_footer: "When these are settled I'll post a 📋 proposed final requirement for ✅."
    proposal: |-
      📋 *PROPOSED FINAL REQUIREMENT*

      {body}

      React ✅ or reply "approved" to approve, or reply with changes.
    spec_pr: |-
      📚 *Living spec update for review* - #{number} {title}
      Approved by {approver}. The living specs are updated to match: {files}
      <{pr_url}|Review and merge PR #{pr_number}> - #{number} becomes *ready for dev* when it is merged.
    spec_branch: |-
      📚 *Living spec update for review* - #{number} {title}
      Approved by {approver}. The spec changes are on branch `{branch}`: {files}
      <{compare_url}|Open the pull request> and merge it - #{number} becomes *ready for dev* then.
    nudge: '⏰ Friendly nudge: some questions above are still open. Answer by number, or "rest ok" to accept the defaults.'
    blocked: "🚧 No answers for a while - #{number} is now marked *blocked*. Reply here to resume."
    done: "✅ Done - #{number} is ready for dev: <{url}|issue #{number}>"
    dev_started: "🛠️ *Developer agent started* on #{number} {title}, branch `{branch}`. <{run_url}|Follow the run>"
    dev_pr: |-
      🛠️ *Code ready for review* - #{number} {title}
      <{pr_url}|Review PR #{pr_number}>. Comment `@claude ...` on the PR to request changes; merge when you're happy.
    dev_branch: |-
      🛠️ *Code ready for review* - #{number} {title}
      The code is on branch `{branch}`. <{compare_url}|Open the pull request>, review it and merge when you're happy.
    dev_no_changes: "⚠️ The developer agent finished #{number} without pushing code. <{run_url}|Its summary is in the run>. The issue is back to *{ready}*."
    dev_done: "🎉 #{number} {title} is merged and done: <{pr_url}|PR #{pr_number}>"
    bug_analyzing: "🐞 *Bug #{number} {title}* is being analyzed. <{url}|Issue> · <{run_url}|Follow the run>"
    bug_analyzing_again: "🐞 #{number} is being analyzed again. <{run_url}|Follow the run>"
    bug_verdict_proposed: |-
      🔎 *Root cause ready* for #{number}: {summary}
      <{link}|Read the analysis> and add `{approved}` to the issue to start the fix.
    bug_verdict_needs_info: "❓ #{number} needs more information from the reporter: <{link}|see the questions>."
    bug_verdict_spec_gap: "📐 #{number} is a spec gap: the specs don't define this behaviour. <{link}|See the analysis>; add `{needs_refinement}` to refine it as a requirement."
    bug_verdict_not_a_bug: "ℹ️ #{number} works as the specs describe. <{link}|See the analysis>; add `{needs_refinement}` to request a change."
    bug_no_report: "⚠️ The investigation of #{number} produced no report. <{run_url}|See the run>. Add `{trigger}` to try again."
    fix_started: "🛠️ *Fix validated* - the developer agent is fixing #{number} on `{branch}`. <{run_url}|Follow the run>"
    fix_pr: |-
      🛠️ *Fix ready for review* - #{number} {title}
      <{pr_url}|Review PR #{pr_number}>. Comment `@claude ...` on the PR to request changes; merge when you're happy.
    fix_branch: |-
      🛠️ *Fix ready for review* - #{number} {title}
      The fix is on branch `{branch}`. <{compare_url}|Open the pull request>, review it and merge when you're happy.
    fix_no_changes: "⚠️ The developer agent finished #{number} without pushing a fix. <{run_url}|Its summary is in the run>. The issue is back to *{ready}*."
    fix_done: "✅ Bug #{number} {title} is fixed: <{pr_url}|PR #{pr_number}> merged."
  github:
    thread_started: "Refinement started in Slack: {link}"
    proposal_posted: "Proposed final requirement posted for approval: {link}"
    proposal_details: "Proposed issue body"
    proposal_specs: "Proposed living spec changes"
    approved: "✅ Approved by {approver} in Slack: {link}\n\nIssue body updated with the final requirement."
    spec_pr_opened: "📚 Living spec update: {pr_url}\nThis issue becomes `{ready}` when the pull request is merged."
    spec_branch_pushed: "📚 Living spec update pushed to `{branch}`. Open the pull request: {compare_url}\nThis issue becomes `{ready}` when it is merged."
    spec_merged: "✅ Living spec merged in {pr_url}. Ready for development."
    spec_pr_title: "Living spec: #{number} {title}"
    spec_pr_body: |-
      Updates the living specs for #{number}, approved by {approver} in Slack: {thread_link}

      Files:
      {files}

      Merging marks #{number} as `{ready}`.
    spec_commit: "Living spec: #{number} {title}"
    original_request: "Original request"
    approved_by: "Approved by: {approver} on {date}"
    approved_pending: "Approved by: (pending)"
    dev_not_ready: "The developer agent only starts on issues labelled `{ready}`. Removed `{trigger}`."
    dev_started: "🛠️ Developer agent started on branch `{branch}`: {run_url}"
    dev_pr: "🛠️ Code ready for review: {pr_url}"
    dev_branch: "🛠️ Code pushed to `{branch}`. Open the pull request: {compare_url}"
    dev_no_changes: "⚠️ The developer agent finished without pushing code. Its summary is in the run: {run_url}"
    dev_pr_title: "#{number} {title}"
    dev_pr_body: |-
      Closes #{number}

      Implemented by the developer agent: {run_url}
    dev_done: "✅ Merged in {pr_url}. Done."
    bug_not_bug_type: "`{trigger}` starts the bug-fix flow only on bugs: issues of type **{type}** or with the `{type_label}` label. Add one of them, then add `{trigger}` again."
    bug_analyzing: "🐞 Root-cause investigation started: {run_url}"
    bug_report_header: "## 🔎 Root-cause analysis\n\nVerdict: **{verdict}** · Confidence: **{confidence}** · [Run]({run_url})\n\n> {summary}"
    bug_next_proposed: "**Next:** validate the root cause and fix plan by adding `{approved}`. To have something re-checked, comment what and add `{trigger}` again."
    bug_next_needs_info: "**Next:** the reporter answers the questions above, then add `{trigger}` again."
    bug_next_spec_gap: "**Next:** the behaviour has to be decided first: add `{needs_refinement}` to refine it as a requirement."
    bug_next_not_a_bug: "**Next:** close the issue, or add `{needs_refinement}` to request a behaviour change."
    bug_no_report: "⚠️ The investigation produced no report: {run_url}. Add `{trigger}` to try again."
    fix_not_validated: "`{approved}` starts the fix only after a root-cause analysis (label `{proposed}`) on a bug (type **{type}** or label `{type_label}`). Removed `{approved}`."
    fix_started: "🛠️ Fix validated. The developer agent is fixing it on `{branch}`: {run_url}"
    fix_pr: "🛠️ Fix ready for review: {pr_url}"
    fix_branch: "🛠️ Fix pushed to `{branch}`. Open the pull request: {compare_url}"
    fix_no_changes: "⚠️ The developer agent finished without pushing a fix. Its summary is in the run: {run_url}"
    fix_pr_title: "Fix #{number}: {title}"
    fix_pr_body: |-
      Fixes #{number}

      Fixed by the developer agent from the validated root-cause analysis: {run_url}
    fix_done: "✅ Fix merged in {pr_url}. Done."
